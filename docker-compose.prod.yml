# Keel - always-on production stack (VPS).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# - keel: the app, running under Litestream (continuous backup to R2).
# - caddy: TLS-terminating reverse proxy (automatic HTTPS) on 80/443.
#
# Data safety: the SQLite database lives on the keel-data volume AND is
# streamed to R2 in real time, so an upgrade or a lost VPS never loses data.
services:
  keel:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    # Raw parsing preserves `$` and similar characters in application secrets.
    # The explicit environment below wins for container-only invariants.
    env_file:
      - path: ${KEEL_APP_ENV_FILE:-.env.prod}
        required: true
        format: raw
    environment:
      NODE_ENV: production
      # Caddy fronts Keel here, so X-Forwarded-For is trustworthy.
      KEEL_TRUST_PROXY: "1"
      PORT: "3000"
      HOST: 0.0.0.0
      HOSTNAME: 0.0.0.0
      DATABASE_URL: file:/data/keel.db
      KEEL_BACKUP_DIR: /data/backups
      NOPIN_UPLOAD_DIR: /data/uploads
      KEEL_CLAIM_REQUIRED: "1"
    volumes:
      - keel-data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - keel
    # Caddy needs hostnames and nothing else. Never give the reverse proxy the
    # application's database, OAuth, backup, or replication credentials.
    env_file:
      - path: ${KEEL_CADDY_ENV_FILE:-.env.caddy}
        required: true
        format: raw
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  keel-data:
  caddy-data:
  caddy-config:
