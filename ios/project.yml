name: Keel
options:
  bundleIdPrefix: com.keelnotes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.2.5
targets:
  Keel:
    type: application
    platform: iOS
    sources:
      - path: Keel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keelnotes.Keel
        PRODUCT_NAME: Keel
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Keel/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      gatherCoverageData: false
      testTargets: []
