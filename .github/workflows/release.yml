# Build the Keel release tarballs on a real machine per platform - the Prisma
# query engine is a native binary, so a macOS build can't produce the Linux
# artifact and vice versa. Runs when a v* tag is pushed; uploads each build to
# that tag's GitHub release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: macos-14
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Build the release
        run: node scripts/package-release.mjs
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Smoke-test the artifact
        run: |
          set -e
          TARBALL=$(ls dist/*.tar.gz | head -1)
          node scripts/archive-safety-check.mjs "$TARBALL"
          DIR=$(mktemp -d)
          tar -xzf "$TARBALL" -C "$DIR"
          APP=$(ls -d "$DIR"/keel-*)
          if ! KEEL_HOME="$DIR/home" PORT=3999 node "$APP/bin/keel.mjs" start; then
            cat "$DIR/home/keel.log" || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:3999/api/health | grep -q '"ok":true'
          node -e 'const fs=require("fs"),p=process.argv[1]; for (const f of [p,p+"-wal",p+"-shm"]) if (fs.existsSync(f) && (fs.statSync(f).mode & 0o777)!==0o600) process.exit(1)' "$DIR/home/keel.db"
          KEEL_HOME="$DIR/home" node "$APP/bin/keel.mjs" stop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keel-${{ matrix.label }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*.tar.gz
