# Deploy the always-on Keel instance to your VPS.
#
# Triggered manually from Actions → Deploy → Run workflow. It SSHes into the
# configured VPS and runs the safe update script, which rebuilds and
# rolls out the container; Litestream keeps your data replicated to R2 the whole
# time, and migrations are additive.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST     the VPS hostname or IP
#   VPS_USER     ssh user (e.g. deploy)
#   VPS_SSH_KEY  a private key authorized on the VPS
#   VPS_PATH     absolute path to the checked-out repo on the VPS
name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch or tag)"
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.VPS_PATH }}"
            REF="${{ github.event.inputs.ref }}"
            if [ -z "$REF" ]; then REF="${GITHUB_REF_NAME:-main}"; fi
            ./scripts/deploy/vps-update.sh "$REF"
